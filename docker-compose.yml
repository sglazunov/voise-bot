# Voice Transcriber — Linux, Docker Compose.
#
#   docker compose up -d --build
#
# Protocol generation needs an LLM, but NONE is installed on the server here.
# Either connect an EXTERNAL Ollama (set OLLAMA_URL in .env — see below) or set a
# cloud key (GROQ_API_KEY / ANTHROPIC_API_KEY / …). Recognition works without any.

services:
  app:
    build:
      context: .
      args:
        # DIARIZATION=1 bakes pyannote+torch into the image (diarization of
        # uploaded audio; needs RAM >= 8 GB). Set it in .env and rebuild.
        DIARIZATION: "${DIARIZATION:-0}"
    image: linux-voise:latest
    container_name: linux-voise
    restart: unless-stopped
    # PID 1 в контейнере — uvicorn (run.sh делает exec), а Python не подбирает
    # осиротевшие процессы. Chromium и ffmpeg каждой записи оседали зомби: на
    # бою за несколько дней накопилось 44. init:true ставит первым процессом
    # tini, который их хоронит. Зомби не едят ни CPU, ни память, но занимают
    # номера процессов — при достаточном количестве система перестаёт запускать
    # новые, и это выглядит как «сервер завис».
    init: true
    depends_on:
      db:
        condition: service_healthy
    ports:
      # APP_BIND=127.0.0.1 прячет порт от интернета — нужно, когда перед
      # приложением стоит Caddy: он ходит к нему по внутренней сети compose,
      # публикация наружу не нужна.
      # ВАЖНО: ufw опубликованный Docker порт НЕ закрывает — Docker пишет свои
      # правила в iptables раньше. Единственный надёжный способ убрать порт из
      # интернета — не публиковать его (или закрыть в группе безопасности ВМ).
      # По умолчанию — только localhost: наружу порт публикуется осознанно
      # (APP_BIND=0.0.0.0 в .env), иначе сайт без TLS торчит в интернет.
      - "${APP_BIND:-127.0.0.1}:${APP_PORT:-8000}:8000"
    env_file:
      - .env
    environment:
      # Ollama is NOT bundled/installed here — connect an external one. Default
      # assumes Ollama runs on the Docker host; override in .env for another server:
      #   OLLAMA_URL=http://host.docker.internal:11434   (Ollama on this machine)
      #   OLLAMA_URL=http://192.168.1.50:11434           (Ollama on another server)
      # Start that Ollama with OLLAMA_HOST=0.0.0.0 so it accepts connections.
      OLLAMA_URL: "${OLLAMA_URL:-http://host.docker.internal:11434}"
      # Structured state (users, sessions, jobs, settings, …) lives in Postgres.
      # Media files still go to ./data. Override credentials via .env if needed.
      DATABASE_URL: "${DATABASE_URL:-postgresql://${POSTGRES_USER:-voise}:${POSTGRES_PASSWORD:?задайте POSTGRES_PASSWORD в .env}@db:5432/${POSTGRES_DB:-voise}}"
      VTX_DIARIZATION: "${DIARIZATION:-0}"
    # Lets host.docker.internal reach a service on the Docker host (Linux too).
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./data:/data
    # Chromium needs more shared memory than the 64 MB default.
    shm_size: "2gb"

  db:
    image: postgres:16-alpine
    container_name: linux-voise-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: "${POSTGRES_USER:-voise}"
      # Без умолчания: предсказуемый пароль «voise» уезжал на каждый сервер.
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?задайте POSTGRES_PASSWORD в .env}"
      POSTGRES_DB: "${POSTGRES_DB:-voise}"
    # A Docker-managed named volume (NOT under ./data) — the app container's
    # entrypoint chowns all of /data to its own user, which would break
    # Postgres's data files if they lived inside that bind mount.
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-voise} -d ${POSTGRES_DB:-voise}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # HTTPS с автоматическим сертификатом Let's Encrypt (продление — само).
  # Поднимается только когда в .env заданы DOMAIN и COMPOSE_PROFILES=https,
  # иначе приложение работает как раньше, по http://IP:8000.
  caddy:
    image: caddy:2-alpine
    container_name: linux-voise-caddy
    restart: unless-stopped
    profiles: ["https"]
    ports:
      - "80:80"       # нужен Let's Encrypt для проверки домена
      - "443:443"
      - "443:443/udp" # HTTP/3
    environment:
      DOMAIN: "${DOMAIN:?укажите DOMAIN в .env}"
      ACME_EMAIL: "${ACME_EMAIL:-}"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # Сертификаты переживают пересоздание контейнера — иначе при каждом
      # перезапуске Let's Encrypt выдавал бы новый и упёрся бы в лимит.
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app

volumes:
  pgdata:
  caddy_data:
  caddy_config:
