name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:

jobs:
  backend:
    name: pytest (backend)
    runs-on: ubuntu-latest
    # Живой Postgres для tests/test_postgres_smoke.py: остальной набор идёт в
    # файловом режиме (conftest убирает DATABASE_URL), а на проде — Postgres.
    # Образ тот же, что в docker-compose.yml.
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: voise
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: voise
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U voise -d voise"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      # faster-whisper/ctranslate2 не ставим: их подменяет tests/conftest.py,
      # а тянуть ~1 ГБ колёс ради тестов, которые их не зовут, незачем.
      - name: Install (без движка распознавания)
        run: |
          python -m pip install --upgrade pip
          grep -vE '^(faster-whisper|ctranslate2|setuptools<80)' requirements.txt > /tmp/req.txt
          # Тот же lock, что в образе (Dockerfile): тесты идут на тех версиях,
          # которые поедут на бой.
          pip install -r /tmp/req.txt httpx numpy -c requirements.lock.txt
      - name: Tests
        env:
          # Не DATABASE_URL: его conftest гасит. Без этой переменной в Actions
          # smoke-набор не пропускается, а падает — опечатка не выключит его молча.
          VTX_TEST_DATABASE_URL: postgresql://voise:ci-only-password@localhost:5432/voise
        run: python -m pytest tests/ -q

  # Lock против ПОЛНОГО дерева зависимостей образа. Job backend вырезает
  # движок распознавания (faster-whisper, ctranslate2 → onnxruntime,
  # tokenizers, huggingface_hub…), и ложный пин в этом поддереве проходил все
  # тесты (ревью 30.10, второй раунд). Здесь pip резолвит весь
  # requirements.txt под lock на той же платформе, что образ (Linux x86_64,
  # CPython 3.12), ничего не ставя: противоречивый или несуществующий пин —
  # ошибка резолва, а пакет без пина, расхождение версии и лишний пин ловит
  # scripts/check_lock.py.
  lock:
    name: lock против полного дерева (pip --dry-run)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: pip резолвит requirements.txt под lock целиком
        run: |
          python -m pip install --upgrade "pip<27" packaging
          python -m pip install --dry-run --ignore-installed --only-binary=:all: \
            --report /tmp/lock-report.json -r requirements.txt -c requirements.lock.txt
          python scripts/check_lock.py /tmp/lock-report.json

  # Конфиг compose на НЕСКОЛЬКИХ вариантах .env, а не только на умолчаниях
  # .env.example (ревью 30.10, §7: зашитый пользователь в DATABASE_URL,
  # сломанный путь Caddyfile и перевёрнутый `test -n` у caddy проходили).
  # scripts/check_compose_config.py разбирает адрес как libpq, сверяет его с
  # сервисом db, а при профиле https проверяет Caddyfile и прогоняет команду
  # caddy через sh с заглушкой. Его тесты и тесты update.sh (шимы docker/git)
  # идут в job backend вместе со всем набором.
  compose:
    name: docker compose config + update.sh
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: bash -n scripts/update.sh
        run: bash -n scripts/update.sh
      - name: compose config на вариантах .env
        run: |
          set -euo pipefail
          fresh_env() {   # .env как по README, с паролем $1
            cp .env.example .env
            sed -i "s/^POSTGRES_PASSWORD=.*/POSTGRES_PASSWORD=$1/" .env
          }
          check() {       # $1 — название варианта, дальше — флаги проверки
            local name="$1"; shift
            echo "::group::$name"
            docker compose config -q
            docker compose config --format json | python3 scripts/check_compose_config.py "$@"
            echo "::endgroup::"
          }

          fresh_env ci-only-password
          check "чистая установка" --fresh

          # Прод: том pgdata создан с паролем voise, в .env осталась строка
          # DATABASE_URL — это рабочая конфигурация (предупреждение, не ошибка),
          # а на чистой установке (--fresh) та же строка — ошибка.
          fresh_env 0123456789abcdef
          echo 'DATABASE_URL=postgresql://voise:voise@db:5432/voise' >> .env
          check "прод со старой строкой DATABASE_URL"
          if docker compose config --format json | python3 scripts/check_compose_config.py --fresh; then
            echo "--fresh обязан отвергать старую строку DATABASE_URL"; exit 1
          fi

          # Пароль с символами, ломающими URL, свой пользователь и база.
          fresh_env x
          sed -i "s|^POSTGRES_PASSWORD=.*|POSTGRES_PASSWORD='p@ss#w/rd%x?y'|; s/^POSTGRES_USER=.*/POSTGRES_USER=vtxuser/; s/^POSTGRES_DB=.*/POSTGRES_DB=vtxdb/" .env
          check "спецсимволы в пароле, свой пользователь" --fresh

          # HTTPS: DOMAIN и профиль — в .env, как на сервере.
          fresh_env ci-only-password
          printf 'DOMAIN=ci.example.com\nCOMPOSE_PROFILES=https\n' >> .env
          docker compose config --services | grep -qx caddy
          check "профиль https (Caddyfile, команда caddy через sh)" --fresh

  frontend:
    name: tsc + vitest + vite build (frontend)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npx tsc --noEmit
      # Vitest + jsdom: гонки и повторы, которые tsc не ловит (useSettings при
      # смене команды, опрос карточки на «Распознавании»).
      - run: npm test
      - run: npx vite build
