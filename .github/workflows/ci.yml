name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:

jobs:
  backend:
    name: pytest (backend)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      # faster-whisper/ctranslate2 не ставим: их подменяет tests/conftest.py,
      # а тянуть ~1 ГБ колёс ради тестов, которые их не зовут, незачем.
      - name: Install (без движка распознавания)
        run: |
          python -m pip install --upgrade pip
          grep -vE '^(faster-whisper|ctranslate2|setuptools<80)' requirements.txt > /tmp/req.txt
          pip install -r /tmp/req.txt httpx numpy
      - name: Tests
        run: python -m pytest tests/ -q

  frontend:
    name: tsc + vite build (frontend)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npx tsc --noEmit
      - run: npx vite build
